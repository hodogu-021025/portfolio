server {
    listen 80;
    server_name _;
    server_tokens off;
    root /usr/share/nginx/html;

    # 해시가 붙은 빌드 산출물은 오래 캐시하고, index.html 은 매번 새로 확인한다
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }
    location / {
        add_header Cache-Control "no-cache";
        try_files $uri /index.html;
    }
}
