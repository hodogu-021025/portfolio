server {
    listen 80;
    server_name _;
    server_tokens off;
    root /usr/share/nginx/html;

    # 없는 주소는 404 로 끝낸다 (index.html 로 돌려주지 않는다).
    # 앞단 Caddy 가 이 404 를 보고 예전 STAR 주소로 여겨 star.hdg3383.com 의 같은 경로로 보낸다 (company-cms/deploy/Caddyfile).
    # 그래서 public/ 에 파일을 새로 넣어도 Caddy 설정을 고칠 필요가 없다. 한 페이지짜리라 클라이언트 라우팅은 없다.
    location = / {
        add_header Cache-Control "no-cache";
        try_files /index.html =404;
    }

    # 해시가 붙은 빌드 산출물은 오래 캐시한다
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    location / {
        try_files $uri =404;
    }
}
